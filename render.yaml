services:
  # Backend (Flask API)
  - type: web
    name: mdrt-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT backend.app_with_db:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: mdrt-db
          property: connectionString
    
  # Database (PostgreSQL)
  - type: pserv
    name: mdrt-db
    runtime: postgresql
    plan: free
    ipAllowList: []

  # Frontend (Static Site)
  - type: web
    name: mdrt-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
