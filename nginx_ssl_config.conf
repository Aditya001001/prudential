# HTTP redirect to HTTPS
server {
    listen 80;
    server_name prudential-uat.innocorn.net;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name prudential-uat.innocorn.net;

    # SSL certificate configuration
    ssl_certificate /home/aditya.developer/prudential/cert.pem;
    ssl_certificate_key /home/aditya.developer/prudential/cert.key;

    # SSL protocols and ciphers (modern secure config)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # SSL session settings
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Backend API (must come before frontend to take precedence)
    location /prudential-api {
        rewrite ^/prudential-api/(.*) /api/$1 break;
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeout for image processing
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;

        # Support large file uploads
        client_max_body_size 50M;
    }

    # Static files (CSS, JS, images) - must come before /prudential
    location /prudential/static/ {
        alias /home/aditya.developer/prudential/frontend/build/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Other static assets (logo, etc) at /prudential root
    location ~ /prudential/.*\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /home/aditya.developer/prudential/frontend/build;
        rewrite ^/prudential/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend (React app) - serves from /prudential/
    location /prudential/ {
        alias /home/aditya.developer/prudential/frontend/build/;
        try_files $uri $uri/ /prudential/index.html;
        index index.html;
    }

    # Exact match for /prudential (without trailing slash)
    location = /prudential {
        return 301 https://$server_name/prudential/;
    }

    # Root redirect to /prudential/
    location = / {
        return 301 https://$server_name/prudential/;
    }
}
